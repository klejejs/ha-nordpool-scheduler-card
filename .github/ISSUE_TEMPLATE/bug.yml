---
name: "Bug report"
description: "Report a bug with the card"
body:
- type: markdown
  attributes:
    value: Before you open a new issue, search through the existing issues to see if others have had the same problem.
- type: input
  attributes:
    label: "Card version"
    description: "Shown in the browser console as NORDPOOL-SCHEDULER-CARD vX.Y.Z"
  validations:
    required: true
- type: input
  attributes:
    label: "Home Assistant version"
  validations:
    required: true
- type: input
  attributes:
    label: "Browser and device"
    placeholder: "Chrome 140 on Windows, Home Assistant Companion app on iOS, ..."
  validations:
    required: true
- type: textarea
  attributes:
    label: "Card configuration"
    description: "The card's YAML from the dashboard editor."
    render: yaml
  validations:
    required: true
- type: textarea
  attributes:
    label: "Describe the issue"
    description: "A clear and concise description of what the issue is. Screenshots help."
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproduction steps
    value: |
      1.
      2.
      3.
      ...
  validations:
    required: true
- type: textarea
  attributes:
    label: "Browser console errors"
    description: "Open the browser's developer tools (F12), reload the dashboard and paste anything red from the Console tab."
    render: text
