name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
        env:
          CARD_VERSION: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/nordpool-scheduler-card.js
          generate_release_notes: true
