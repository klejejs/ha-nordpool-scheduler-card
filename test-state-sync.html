<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>State Sync Test - Nordpool Scheduler Card</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .test-container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .test-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .test-section h3 {
      margin-top: 0;
    }

    .status {
      padding: 8px 12px;
      border-radius: 4px;
      display: inline-block;
      margin: 5px 0;
    }

    .pass {
      background: #d4edda;
      color: #155724;
    }

    .fail {
      background: #f8d7da;
      color: #721c24;
    }

    .info {
      background: #d1ecf1;
      color: #0c5460;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 4px;
      background: #007bff;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #0056b3;
    }

    pre {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }

    .card-container {
      margin: 20px 0;
      min-height: 400px;
    }
  </style>
</head>

<body>
  <div class="test-container">
    <h1>🧪 Nordpool Scheduler Card - State Sync Tests</h1>

    <div class="test-section">
      <h3>Test Controls</h3>
      <button onclick="runAllTests()">▶️ Run All Tests</button>
      <button onclick="testBackendStateSync()">Test Backend State Sync</button>
      <button onclick="testOptimisticUpdate()">Test Optimistic Update</button>
      <button onclick="testStateConflict()">Test State Conflict</button>
      <button onclick="clearResults()">🗑️ Clear Results</button>
    </div>

    <div class="test-section">
      <h3>📊 Test Results</h3>
      <div id="results"></div>
    </div>

    <div class="test-section">
      <h3>🎴 Live Card (with mock backend)</h3>
      <div id="card-status" class="status info">
        Card will be loaded with mock Home Assistant instance
      </div>
      <div class="card-container">
        <nordpool-scheduler-card id="test-card"></nordpool-scheduler-card>
      </div>
    </div>

    <div class="test-section">
      <h3>📝 Console Logs</h3>
      <button onclick="document.getElementById('console-logs').innerHTML = ''">Clear Logs</button>
      <pre id="console-logs"></pre>
    </div>
  </div>

  <script type="module">
    import './nordpool-scheduler-card.js';

    // Mock Home Assistant instance
    let mockScheduledSlots = [0, 4, 8, 12, 16, 20]; // Initial backend state

    function createMockHass(slots) {
      const scheduled_overrides = slots.map(slot => ({
        time: `${Math.floor(slot / 4).toString().padStart(2, '0')}:${((slot % 4) * 15).toString().padStart(2, '0')}`,
        slot: slot,
        state: 'on'
      }));

      return {
        states: {
          'sensor.test_scheduler': {
            state: '0.05',
            attributes: {
              entry_id: 'TEST123',
              scheduler_name: 'Test Scheduler',
              prices: Array(192).fill(0).map((_, i) => Math.random() * 0.5),
              scheduled_overrides: scheduled_overrides,
              scheduled_overrides_count: slots.length,
              current_slot: 40,
              min_price: 0.01,
              max_price: 0.5,
              avg_price: 0.25,
              default_state: 'off',
              last_update: new Date().toISOString(),
            }
          }
        },
        callService: async (domain, service, data) => {
          console.log(`📡 Service called: ${domain}.${service}`, data);

          // Simulate backend processing
          await new Promise(resolve => setTimeout(resolve, 500));

          // Update mock backend state
          mockScheduledSlots = [];
          for (let i = 0; i < 96; i++) {
            if (data.slots[i.toString()] === true) {
              mockScheduledSlots.push(i);
            }
          }

          console.log('✅ Backend updated, new slots:', mockScheduledSlots.length);

          // Update card with new backend state
          setTimeout(() => {
            card.hass = createMockHass(mockScheduledSlots);
          }, 100);
        }
      };
    }

    const card = document.getElementById('test-card');
    card.setConfig({
      type: 'custom:nordpool-scheduler-card',
      entity: 'sensor.test_scheduler',
      name: 'Test Scheduler',
      show_name: true,
      show_prices: true,
    });

    // Initial setup
    card.hass = createMockHass(mockScheduledSlots);

    // Intercept console.log for display
    const originalLog = console.log;
    const logElement = document.getElementById('console-logs');
    console.log = function (...args) {
      originalLog.apply(console, args);
      logElement.textContent += args.map(a =>
        typeof a === 'object' ? JSON.stringify(a, null, 2) : a
      ).join(' ') + '\n';
      logElement.scrollTop = logElement.scrollHeight;
    };

    // Test functions
    window.clearResults = function () {
      document.getElementById('results').innerHTML = '';
    };

    function addResult(test, passed, message) {
      const div = document.createElement('div');
      div.className = `status ${passed ? 'pass' : 'fail'}`;
      div.textContent = `${passed ? '✅' : '❌'} ${test}: ${message}`;
      document.getElementById('results').appendChild(div);
    }

    window.testBackendStateSync = async function () {
      console.log('\n🧪 TEST: Backend State Sync');

      // Set backend to specific state
      mockScheduledSlots = [1, 5, 9, 13];
      card.hass = createMockHass(mockScheduledSlots);

      await new Promise(resolve => setTimeout(resolve, 100));

      const attrs = card.hass.states['sensor.test_scheduler'].attributes;
      const backendCount = attrs.scheduled_overrides_count;

      if (backendCount === 4) {
        addResult('Backend State Sync', true, `Backend has ${backendCount} slots`);
      } else {
        addResult('Backend State Sync', false, `Expected 4, got ${backendCount}`);
      }
    };

    window.testOptimisticUpdate = async function () {
      console.log('\n🧪 TEST: Optimistic Update');

      // Click a slot programmatically
      mockScheduledSlots = [10, 20, 30];
      card.hass = createMockHass(mockScheduledSlots);

      await new Promise(resolve => setTimeout(resolve, 100));

      // Simulate click
      const slot = {
        index: 40, hour: 10, minute: 0, time: '10:00', price: 0.1,
        isSelected: false, isCurrentTime: false, isPastTime: false, isTomorrow: false
      };
      card._handleSlotClick(slot);

      await new Promise(resolve => setTimeout(resolve, 100));

      addResult('Optimistic Update', true, 'Slot clicked, waiting for backend...');

      // Wait for backend to process
      await new Promise(resolve => setTimeout(resolve, 700));

      const newCount = card.hass.states['sensor.test_scheduler'].attributes.scheduled_overrides_count;
      if (newCount === 4) {
        addResult('Backend Processing', true, `Backend updated to ${newCount} slots`);
      } else {
        addResult('Backend Processing', false, `Expected 4, got ${newCount}`);
      }
    };

    window.testStateConflict = async function () {
      console.log('\n🧪 TEST: State Conflict Resolution');

      // Simulate state conflict
      mockScheduledSlots = [1, 2, 3];
      card.hass = createMockHass(mockScheduledSlots);

      await new Promise(resolve => setTimeout(resolve, 200));

      // Backend changes while user is clicking
      setTimeout(() => {
        mockScheduledSlots = [10, 20, 30];
        card.hass = createMockHass(mockScheduledSlots);
        console.log('📡 Backend changed state externally');
      }, 300);

      await new Promise(resolve => setTimeout(resolve, 500));

      addResult('State Conflict', true, 'Card should sync to latest backend state');
    };

    window.runAllTests = async function () {
      clearResults();
      document.getElementById('console-logs').innerHTML = '';

      console.log('🚀 Running all tests...\n');

      await testBackendStateSync();
      await new Promise(resolve => setTimeout(resolve, 1000));

      await testOptimisticUpdate();
      await new Promise(resolve => setTimeout(resolve, 1000));

      await testStateConflict();

      console.log('\n✅ All tests completed!');
    };

    // Make card accessible for debugging
    window.testCard = card;
    window.mockHass = createMockHass;

    console.log('✅ Test environment ready. Click "Run All Tests" to start.');
  </script>
</body>

</html>
