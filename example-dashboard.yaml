# Example Lovelace dashboard for the Nordpool Scheduler card.
# Adjust the entity ids to match your own scheduler entries.

views:
  - title: Nordpool Scheduler
    path: nordpool
    icon: mdi:calendar-clock
    cards:
      - type: custom:nordpool-scheduler-card
        entity: sensor.nordpool_scheduler_boiler_electricity_price
        name: Boiler
        show_history: true

      - type: custom:nordpool-scheduler-card
        entity: sensor.nordpool_scheduler_water_heater_electricity_price
        name: Water Heater
        show_day_tabs: true
        compact: true

      # A prices-only entry: shows prices, nothing to click.
      - type: custom:nordpool-scheduler-card
        entity: sensor.nordpool_scheduler_prices_lv_electricity_price
        name: Electricity prices

      - type: horizontal-stack
        cards:
          - type: custom:nordpool-scheduler-card
            entity: sensor.nordpool_scheduler_device_1_electricity_price
            show_name: false
            show_history: false
          - type: custom:nordpool-scheduler-card
            entity: sensor.nordpool_scheduler_device_2_electricity_price
            show_name: false
            show_history: false
