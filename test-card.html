<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nordpool Scheduler Card Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      font-weight: 500;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    pre {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🧪 Nordpool Scheduler Card Test</h1>

    <div id="status" class="status">
      Loading card...
    </div>

    <h2>Card Element</h2>
    <div id="card-test">
      <nordpool-scheduler-card></nordpool-scheduler-card>
    </div>

    <h2>Debug Info</h2>
    <pre id="debug"></pre>
  </div>

  <script type="module">
    import './dist/nordpool-scheduler-card.js';

    const statusEl = document.getElementById('status');
    const debugEl = document.getElementById('debug');
    const cardEl = document.querySelector('nordpool-scheduler-card');

    let debugInfo = [];

    // Check if custom element is defined
    setTimeout(() => {
      const isDefined = customElements.get('nordpool-scheduler-card');

      debugInfo.push(`Custom Element Defined: ${!!isDefined}`);
      debugInfo.push(`Element in DOM: ${!!cardEl}`);
      debugInfo.push(`Element tag name: ${cardEl?.tagName || 'N/A'}`);
      debugInfo.push(`Has setConfig method: ${typeof cardEl?.setConfig === 'function'}`);

      if (isDefined) {
        statusEl.className = 'status success';
        statusEl.textContent = '✅ Card loaded successfully!';

        // Try to configure the card
        try {
          cardEl.setConfig({
            type: 'custom:nordpool-scheduler-card',
            entity: 'sensor.test',
            name: 'Test Card'
          });
          debugInfo.push('setConfig called: SUCCESS');
        } catch (err) {
          debugInfo.push(`setConfig error: ${err.message}`);
        }
      } else {
        statusEl.className = 'status error';
        statusEl.textContent = '❌ Card failed to load!';
        debugInfo.push('ERROR: Custom element not registered');
      }

      debugEl.textContent = debugInfo.join('\n');
    }, 1000);

    // Log any console errors
    window.addEventListener('error', (e) => {
      console.error('Page error:', e);
      statusEl.className = 'status error';
      statusEl.textContent = `❌ Error: ${e.message}`;
    });
  </script>
</body>

</html>
